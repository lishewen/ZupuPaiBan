name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish ZupuPaiBan/ZupuPaiBan.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - uses: actions/upload-artifact@v5
        with:
          name: zupupaiban-win-x64
          path: ZupuPaiBan/bin/Release/net10.0-windows/win-x64/publish/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: zupupaiban-win-x64
          path: zupupaiban-win-x64
      - name: Package
        run: cd zupupaiban-win-x64 && zip -r ../zupupaiban-win-x64.zip .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" zupupaiban-win-x64.zip --generate-notes --repo lishewen/ZupuPaiBan
